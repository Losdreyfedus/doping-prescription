# Loaded in addition to the main application.yml for every test context: test-only secrets and settings.
prescription.quiz.token-secret=test-only-quiz-secret-0123456789-abcdefghij
# Test contexts share one database, and contexts without Kafka leave their publications incomplete. Resubmitting them,
# periodically or when a context with Kafka starts, would replay other tests' events into the running test.
prescription.messaging.outbox.resubmit-enabled=false
spring.modulith.events.republish-outstanding-events-on-restart=false
# Every test logs in through the demo login, like the demo profile.
prescription.auth.demo-login-enabled=true
