spring:
  application:
    name: doping-prescription-core
  # Defaults match docker-compose.yml; override with environment variables outside local development.
  datasource:
    url: ${PRESCRIPTION_DB_URL:jdbc:postgresql://localhost:5432/prescription}
    username: ${PRESCRIPTION_DB_USER:prescription}
    password: ${PRESCRIPTION_DB_PASSWORD:prescription}
  jpa:
    # Schema is owned by Flyway; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      # The event_publication table is created by Flyway (V2), never by Modulith itself.
      jdbc:
        schema-initialization:
          enabled: false
  data:
    redis:
      host: ${PRESCRIPTION_REDIS_HOST:localhost}
      port: ${PRESCRIPTION_REDIS_PORT:6379}
      # Short timeouts: a Redis outage must degrade to PostgreSQL reads, not stall requests (docs/mimari.md §5).
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: ${PRESCRIPTION_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Key = userId (string). Spring Modulith hands over the event already serialized to JSON bytes, so the value is
      # written as-is; a JSON serializer here would wrap it again as a base64 string.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
    consumer:
      # Listeners read the raw JSON and map it to the publishing module's api event themselves.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest

server:
  port: 8080

springdoc:
  # Stable key order keeps the committed openapi.json diff-friendly (ADR 0004).
  writer-with-order-by-keys: true
  api-docs:
    path: /v3/api-docs
    # OpenAPI 3.0 keeps "nullable", which openapi-typescript turns into "| null" in the UI's types.
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      # Component details (postgres, redis, kafka) only for authorized ADMIN users; until Spring Security is
      # configured in phase 2 nobody is authorized, so only the aggregate status is public.
      show-details: when-authorized
      roles: ADMIN

prescription:
  timezone: Europe/Istanbul
  auth:
    # Required outside the demo profile; never logged (docs/mimari.md §6).
    jwt-secret: ${PRESCRIPTION_JWT_SECRET}
    token-ttl: 12h
    cors-allowed-origin: http://localhost:5173
  health:
    kafka:
      timeout: 2s
  content:
    tagging:
      min-confidence: 0.5
  learner:
    mastery:
      alpha: 0.3
      initial: 0.5
      confidence-k: 5
      decay-lambda: 0.01
      signal-weights:
        exam: 1.0
        exam-blank: 0.8
        quiz: 0.4
      change-event-threshold: 0.05
      band:
        weak-threshold: 0.6
        strong-threshold: 0.8
    cache-ttl: 24h
  feed:
    page-size: 10
    page-size-max: 20
    queue-size: 30
    queue-ttl: 30m
    queue-refill-threshold: 5
    session-ttl: 30m
    quota:
      weak-topic: 0.60
      review-due: 0.15
      explore: 0.15
      popular: 0.10
    cold-start-quota:
      explore: 0.70
      popular: 0.30
    weak-topic-count: 5
    review-after-days: 7
    rank-weights:
      weakness: 0.45
      exam-importance: 0.20
      quality: 0.15
      freshness: 0.10
      difficulty-fit: 0.10
    exam-near-days: 60
    exam-near-weight: 0.30
    max-same-topic-in-row: 2
    rewatch-block-days: 14
    skip-defer-count: 3
    demo-video-speed: 4
    # Videos that open a personalized session, in order; the demo profile pins its real videos.
    pinned-content-ids: []
  points:
    correct: 10
    weak-topic-correct: 15
    streak-length: 5
    streak-bonus: 20
    daily-cap: 200
  quiz:
    min-watch-ratio: 0.70
    time-limit-sec: 60
    token-ttl: 5m
    min-response-ms: 2000
    rate-limit-per-min: 30
    # Required outside the demo profile; never logged (docs/api.md, quizToken).
    token-secret: ${PRESCRIPTION_QUIZ_TOKEN_SECRET}
