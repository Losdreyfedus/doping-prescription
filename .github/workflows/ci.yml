name: CI

# Every push and every pull request (docs/kod-standartlari.md §5).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (./mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: doping-prescription-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests, Testcontainers integration tests (Docker is available on ubuntu runners)
      # and all quality gates: Spotless, Checkstyle, SpotBugs, JaCoCo, Modulith, ArchUnit.
      - run: ./mvnw -B -ntp verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-reports
          path: |
            doping-prescription-core/target/surefire-reports
            doping-prescription-core/target/failsafe-reports
            doping-prescription-core/target/site/jacoco
          if-no-files-found: ignore

  ui:
    name: ui (npm run check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: doping-prescription-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: doping-prescription-ui/.nvmrc
          cache: npm
          cache-dependency-path: doping-prescription-ui/package-lock.json
      - run: npm ci
      # Typecheck, ESLint (0 warnings), Prettier check and Vitest.
      - run: npm run check
      - run: npm run build
