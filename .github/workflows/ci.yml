name: CI

# Every push and every pull request (docs/kod-standartlari.md §5).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (./mvnw verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: doping-prescription-core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests, Testcontainers integration tests (Docker is available on ubuntu runners)
      # and all quality gates: Spotless, Checkstyle, SpotBugs, JaCoCo, Modulith, ArchUnit.
      - run: ./mvnw -B -ntp verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-reports
          path: |
            doping-prescription-core/target/surefire-reports
            doping-prescription-core/target/failsafe-reports
            doping-prescription-core/target/site/jacoco
          if-no-files-found: ignore

  ui:
    name: ui (npm run check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: doping-prescription-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: doping-prescription-ui/.nvmrc
          cache: npm
          cache-dependency-path: doping-prescription-ui/package-lock.json
      - run: npm ci
      # Typecheck, ESLint (0 warnings), Prettier check and Vitest.
      - run: npm run check
      - run: npm run build

  e2e:
    name: e2e (demo scenario)
    runs-on: ubuntu-24.04  # Playwright 1.55 installs its browser dependencies for 24.04; ubuntu-latest moved to 26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: doping-prescription-ui/.nvmrc
          cache: npm
          cache-dependency-path: |
            doping-prescription-ui/package-lock.json
            e2e/package-lock.json
      # PostgreSQL, Redis and Kafka as in local development; --wait blocks until their health checks pass.
      - run: docker compose up -d --wait postgres redis kafka
      # The core job runs the tests; here only the runnable jar is needed.
      - run: ./mvnw -B -ntp -DskipTests package
        working-directory: doping-prescription-core
      - run: npm ci
        working-directory: doping-prescription-ui
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Playwright starts the backend (demo profile) and the web app itself (e2e/playwright.config.ts).
      - run: npm test
        working-directory: e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
